<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中英文單字複習器</title>
    <style>
        :root {
            --bg-color: #f7f9fa;
            --card-bg: #ffffff;
            --primary-color: #4a6fa5;
            --primary-hover: #3b5984;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border-color: #e2e8f0;
            --correct-color: #27ae60;
            --wrong-color: #e74c3c;
        }

        * { box-sizing: border-box; }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        h1 { font-size: 22px; text-align: center; margin: 0 0 8px 0; }
        .subtitle { color: var(--text-sub); text-align: center; font-size: 14px; margin-bottom: 16px; }

        .unit-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            transition: all 0.2s;
        }

        .btn.active {
            background-color: var(--primary-color) !important;
            color: #ffffff !important;
            border-color: var(--primary-color) !important;
        }

        .btn-main {
            width: 100%;
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .flashcard {
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            text-align: center;
            padding: 15px;
        }

        .word-title { font-size: 30px; font-weight: bold; margin-bottom: 8px; }
        .word-pos { font-size: 14px; color: var(--primary-color); background: #eef2f7; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
        .word-meaning { font-size: 22px; font-weight: 500; color: #333; }
        .word-example { font-size: 14px; color: var(--text-sub); margin-top: 12px; line-height: 1.4; }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .option-btn {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: white;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
        }

        .option-btn.correct { background-color: var(--correct-color) !important; color: white !important; border-color: var(--correct-color) !important; }
        .option-btn.wrong { background-color: var(--wrong-color) !important; color: white !important; border-color: var(--wrong-color) !important; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div id="setup-page" class="card">
            <h1>高中英文單字複習器</h1>
            <div class="subtitle">Unit 11 - Unit 16 手寫範圍</div>

            <h3 style="font-size: 15px;">1. 選擇單字範圍</h3>
            <div class="unit-grid">
                <button class="btn unit-btn active" onclick="toggleUnit(11)">Unit 11</button>
                <button class="btn unit-btn active" onclick="toggleUnit(12)">Unit 12</button>
                <button class="btn unit-btn active" onclick="toggleUnit(13)">Unit 13</button>
                <button class="btn unit-btn active" onclick="toggleUnit(14)">Unit 14</button>
                <button class="btn unit-btn active" onclick="toggleUnit(15)">Unit 15</button>
                <button class="btn unit-btn active" onclick="toggleUnit(16)">Unit 16</button>
            </div>

            <h3 style="font-size: 15px;">2. 選擇複習模式</h3>
            <div style="display: flex; gap: 8px; margin-bottom: 20px;">
                <button id="mode-card" class="btn active" style="flex: 1;" onclick="setMode('card')">閃卡翻面</button>
                <button id="mode-choice" class="btn" style="flex: 1;" onclick="setMode('choice')">看英選中</button>
                <button id="mode-zh-choice" class="btn" style="flex: 1;" onclick="setMode('zh-choice')">看中選英</button>
            </div>

            <button class="btn-main" onclick="startPractice()">開始複習</button>
        </div>

        <div id="practice-page" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <button class="btn" style="padding: 6px 12px; font-size: 12px;" onclick="backToSetup()">← 返回設定</button>
                <span id="progress-text" style="color: var(--text-sub); font-size: 14px;">0 / 0</span>
            </div>

            <div id="flashcard-view">
                <div class="flashcard" onclick="flipCard()">
                    <div id="card-front">
                        <div id="fc-en" class="word-title"></div>
                        <div id="fc-pos-front" class="word-pos"></div>
                        <div style="font-size: 13px; color: var(--text-sub); margin-top: 10px;">(點擊顯示中文與例句)</div>
                    </div>
                    <div id="card-back" class="hidden">
                        <div id="fc-zh" class="word-meaning"></div>
                        <div id="fc-pos-back" class="word-pos" style="margin-top: 8px;"></div>
                        <div id="fc-example" class="word-example"></div>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="btn" style="flex: 1;" onclick="prevCard()">上一個</button>
                    <button class="btn-main" style="flex: 1;" onclick="nextCard()">下一個</button>
                </div>
            </div>

            <div id="choice-view" class="hidden">
                <div style="text-align: center; margin: 15px 0;">
                    <div id="quiz-prompt" class="word-title"></div>
                    <div id="quiz-pos" class="word-pos"></div>
                </div>
                <div id="options-container" class="options-grid"></div>
                <div id="quiz-next-area" class="hidden" style="margin-top: 15px;">
                    <div id="quiz-example" class="word-example" style="margin-bottom: 10px; text-align: center;"></div>
                    <button class="btn-main" onclick="nextCard()">下一題</button>
                </div>
            </div>
        </div>
    </div>

        let selectedUnits = [11, 12, 13, 14, 15, 16];
        let currentMode = 'card';
        let currentList = [];
        let currentIndex = 0;
        let isFlipped = false;

        function toggleUnit(unit) {
            const idx = selectedUnits.indexOf(unit);
            if (idx > -1) {
                if (selectedUnits.length > 1) selectedUnits.splice(idx, 1);
            } else {
                selectedUnits.push(unit);
            }
            updateUnitButtons();
        }

        function updateUnitButtons() {
            const btns = document.querySelectorAll('.unit-btn');
            btns.forEach((btn, index) => {
                const u = index + 11;
                if (selectedUnits.includes(u)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('mode-card').classList.toggle('active', mode === 'card');
            document.getElementById('mode-choice').classList.toggle('active', mode === 'choice');
            document.getElementById('mode-zh-choice').classList.toggle('active', mode === 'zh-choice');
        }

        function startPractice() {
            currentList = vocabulary.filter(item => selectedUnits.includes(item.unit));
            if (currentList.length === 0) return;
            
            // 打亂單字順序
            currentList.sort(() => Math.random() - 0.5);

            currentIndex = 0;
            document.getElementById('setup-page').classList.add('hidden');
            document.getElementById('practice-page').classList.remove('hidden');

            if (currentMode === 'card') {
                document.getElementById('flashcard-view').classList.remove('hidden');
                document.getElementById('choice-view').classList.add('hidden');
                showFlashcard();
            } else {
                document.getElementById('flashcard-view').classList.add('hidden');
                document.getElementById('choice-view').classList.remove('hidden');
                showQuiz();
            }
        }

        function backToSetup() {
            document.getElementById('setup-page').classList.remove('hidden');
            document.getElementById('practice-page').classList.add('hidden');
        }

        // --- 閃卡邏輯 ---
        function showFlashcard() {
            isFlipped = false;
            const item = currentList[currentIndex];
            document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${currentList.length}`;
            
            document.getElementById('fc-en').innerText = item.en;
            document.getElementById('fc-pos-front').innerText = item.pos;
            
            document.getElementById('fc-zh').innerText = item.zh;
            document.getElementById('fc-pos-back').innerText = item.pos;
            document.getElementById('fc-example').innerText = `例句: ${item.example}`;

            document.getElementById('card-front').classList.remove('hidden');
            document.getElementById('card-back').classList.add('hidden');
        }

        function flipCard() {
            isFlipped = !isFlipped;
            document.getElementById('card-front').classList.toggle('hidden', isFlipped);
            document.getElementById('card-back').classList.toggle('hidden', !isFlipped);
        }

        // --- 測驗邏輯 (看英選中 / 看中選英) ---
        function showQuiz() {
            document.getElementById('quiz-next-area').classList.add('hidden');
            document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${currentList.length}`;
            
            const item = currentList[currentIndex];
            const isEngToZh = (currentMode === 'choice');

            document.getElementById('quiz-prompt').innerText = isEngToZh ? item.en : item.zh;
            document.getElementById('quiz-pos').innerText = item.pos;

            // 隨機抽 3 個干擾選項
            let options = [item];
            let pool = vocabulary.filter(v => v.en !== item.en);
            pool.sort(() => Math.random() - 0.5);
            options.push(pool[0], pool[1], pool[2]);
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = isEngToZh ? opt.zh : opt.en;
                btn.onclick = () => checkAnswer(btn, opt, item);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selectedBtn, selectedOpt, correctOpt) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.onclick = null); // 防止重複點擊

            const isEngToZh = (currentMode === 'choice');

            if (selectedOpt.en === correctOpt.en) {
                selectedBtn.classList.add('correct');
            } else {
                selectedBtn.classList.add('wrong');
                allBtns.forEach(btn => {
                    if (btn.innerText === (isEngToZh ? correctOpt.zh : correctOpt.en)) {
                        btn.classList.add('correct');
                    }
                });
            }

            document.getElementById('quiz-example').innerText = `例句: ${correctOpt.example}`;
            document.getElementById('quiz-next-area').classList.remove('hidden');
        }

        function nextCard() {
            if (currentIndex < currentList.length - 1) {
                currentIndex++;
                if (currentMode === 'card') showFlashcard();
                else showQuiz();
            } else {
                alert('恭喜你！已經複習完全部選定的單字囉！');
                backToSetup();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                showFlashcard();
            }
        }
    </script>
</body>
</html>
